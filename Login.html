
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | PetShoppy</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="Auth.css">

    <script src="Auth.js" defer></script>
</head>

<body class="login-page">

    <main class="login-main">

        <div class="login-card">

            <!-- PETSHOPPY LOGO -->
            <a href="index.html" class="login-logo">
                <span class="login-logo-icon">
                    <i class="fa-solid fa-paw"></i>
                </span>

                <span class="login-logo-text">
                    Pet<span>Shoppy</span>
                    <small>Everything Your Pet Loves</small>
                </span>
            </a>

            <!-- HEADING -->
            <div class="login-heading">
                <h1>Welcome Back!</h1>
                <p>Sign in to continue to your account</p>
            </div>

            <!-- LOGIN FORM -->
            <form id="loginForm">

                <div class="login-field">
                    <label for="loginEmail">Email Address</label>

                    <input
                        type="email"
                        id="loginEmail"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="username"
                        required>
                </div>

                <div class="login-field">
                    <label for="loginPassword">Password</label>

                    <div class="login-password-wrapper">

                        <input
                            type="password"
                            id="loginPassword"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required>

                        <button
                            type="button"
                            class="password-toggle"
                            data-toggle="loginPassword"
                            aria-label="Show password">

                            <i class="fa-solid fa-eye"></i>

                        </button>

                    </div>
                </div>

                <!-- REMEMBER ME + FORGOT PASSWORD -->
                <div class="login-options">

                    <label class="login-remember">
                        <input type="checkbox" id="rememberMe">
                        <span>Remember me</span>
                    </label>

                    <a href="#" id="forgotPassword">
                        Forgot password?
                    </a>

                </div>

                <!-- LOGIN BUTTON -->
                <button type="submit" class="login-submit">
                    <i class="fa-solid fa-right-to-bracket"></i>
                    Login
                </button>

                <p id="loginStatus" class="login-status"
                   aria-live="polite"></p>

            </form>

            <!-- SOCIAL LOGIN -->
            <div class="login-divider">
                <span>Or continue with</span>
            </div>

            <div class="login-social">

                <button type="button"
                        class="login-social-btn"
                        data-provider="Google">

                    <i class="fa-brands fa-google google-icon"></i>
                    <span>Google</span>

                </button>

                <button type="button"
                        class="login-social-btn"
                        data-provider="Apple">

                    <i class="fa-brands fa-apple apple-icon"></i>
                    <span>Apple</span>

                </button>

            </div>

            <!-- REGISTRATION LINK -->
            <div class="login-register">
                <span>Don't have an account?</span>

                <a href="Register.html">
                    Create a free account
                </a>
            </div>

        </div>

    </main>

    <!-- FOOTER -->
    <footer class="login-footer">
        © 2026 PetShoppy. Everything Your Pet Loves.
    </footer>

</body>
</html>
